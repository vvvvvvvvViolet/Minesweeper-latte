name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/engine.test.js

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not enabled yet.
          enablement: true

      # Stamps the commit into the service worker cache name so a deploy always
      # invalidates the old cache. Without it, a forgotten manual bump serves
      # the new HTML alongside stale cached CSS/JS.
      - name: Stamp the service worker cache version
        run: |
          sed -i "s/^var CACHE_VERSION = '[^']*';/var CACHE_VERSION = '${GITHUB_SHA}';/" sw.js
          grep -q "^var CACHE_VERSION = '${GITHUB_SHA}';" sw.js || {
            echo "::error::Could not stamp CACHE_VERSION - has the declaration in sw.js changed?"
            exit 1
          }
          grep '^var CACHE_VERSION' sw.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
